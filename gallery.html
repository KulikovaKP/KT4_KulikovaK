<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <header>
        <div class="container header-inner">
            <a href="#" class="logo">Pro Desing</a>
            <nav>
                <ul>
                    <li><a href="#process">Процесс</a></li>
                    <li><a href="gallery.html">Наши работы</a></li>
                    <li><a href="courses.html">Курсы</a></li>

    <section id="gallery" class="slider-section">
        <div class="container">
            <h2>Работы наших учеников</h2>           
            <div class="css-slider">
                <input type="radio" name="slider" id="slide1" checked>
                <input type="radio" name="slider" id="slide2">
                <input type="radio" name="slider" id="slide3">
                <div class="slider-track">
                    <div class="slide">
                        <img src="site1.png" alt="Сайт1">
                        <div class="slide-caption">Илья Смирнов, 24 года </div>
                    </div>
                    <div class="slide">
                        <img src="site2.png" alt="Сайт2">
                        <div class="slide-caption">Елена Котова, 31 год</div>
                    </div>
                    <div class="slide">
                        <img src="site3.png" alt="Сайт3">
                        <div class="slide-caption">Артём Смирнов, 19 лет</div>
                    </div>
                </div>
                <div class="slider-nav">
                    <label for="slide1"></label>
                    <label for="slide2"></label>
                    <label for="slide3"></label>
                </div>
            </div>
        </div>
    </section>
